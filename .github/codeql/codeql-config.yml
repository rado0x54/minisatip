name: "minisatip CodeQL config"

# The newcamd wire protocol mandates DES-EDE2-CBC for framing
# (src/newcamd.cpp). The DES_* calls there are interop with that protocol,
# not a chosen-cryptography decision — no stronger algorithm can substitute,
# the counterpart server speaks DES. CodeQL's `query-filters.exclude` is
# repository-wide (no per-path sub-key), but nothing else in this repo uses
# DES, so a global suppression of this one rule is functionally identical
# to a file-scoped one.
query-filters:
  - exclude:
      id: cpp/weak-cryptographic-algorithm
