name: Userspace DVB Binaries

# Cross-platform static binaries with USERSPACE_DVB=ON. Targets Apple
# Silicon plus the x86_64 and aarch64 Synology model families. Each
# job builds libusb-1.0 statically from source so the resulting binary
# has no third-party shared-lib runtime dependencies — libudev is
# disabled on Linux (libusb still enumerates without it; hotplug just
# becomes unavailable, which we don't use), and on macOS libusb talks
# to IOKit directly so udev is moot.

on:
  push:
    branches: [ master, userspace-dvb-support ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # Pin to a tag once rado0x54/dvb-libusb has one; until then, main.
  DVB_LIBUSB_REF: main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
          - runner: macos-14
            arch: arm64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # libdvbcsa is built from source below (we need the ICAM
          # extension; the apt libdvbcsa-dev package doesn't carry the
          # extension and historically may or may not ship .a anyway).
          # libusb-1.0-0-dev, libssl-dev, libsrt-openssl-dev all ship
          # .a archives; CMAKE_FIND_LIBRARY_SUFFIXES=.a below makes
          # find_library prefer them.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zip ca-certificates \
            autoconf libtool automake \
            libusb-1.0-0-dev libudev-dev \
            libssl-dev libsrt-openssl-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # libdvbcsa is built from source below (we need the ICAM
          # extension, not in the brew formula). libusb + srt + openssl
          # come from brew; dvb-libusb's DVB_LIBUSB_PREFER_LIBUSB_STATIC
          # option below forces libusb to resolve to its .a even though
          # the .dylib sits beside it.
          brew install --quiet cmake pkg-config autoconf libtool automake wget \
            libusb srt openssl@3

      - name: Build libdvbcsa (with ICAM) from source
        run: |
          set -eux
          # catalinii/libdvbcsa carries the ICAM extension that
          # minisatip's src/csa.cpp probes for via a weak symbol.
          # Building from source on all platforms gives both the ICAM
          # symbol and a guaranteed libdvbcsa.a — the apt package on
          # Linux may not always ship the static archive, and the brew
          # formula on macOS doesn't carry the ICAM extension either.
          git clone --depth 1 https://github.com/catalinii/libdvbcsa.git libdvbcsa-src
          cd libdvbcsa-src
          autoreconf -fi
          ./configure \
            --disable-shared --enable-static \
            --prefix="$GITHUB_WORKSPACE/libdvbcsa-install"
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"
          make install

      - name: Force static-only brew prefixes (macOS)
        if: runner.os == 'macOS'
        run: |
          # Apple's ld has no -static flag, so we coerce static linking
          # by removing the .dylib/.tbd siblings from each brew prefix
          # we depend on. With only .a left in the prefix the linker
          # has nothing else to pick. Safe because runners are
          # ephemeral. openssl@3 is keg-only so its dylibs live under
          # opt/openssl@3 rather than /opt/homebrew/lib.
          for prefix in $(brew --prefix libusb) $(brew --prefix srt) $(brew --prefix openssl@3); do
            rm -fv "$prefix"/lib/*.dylib "$prefix"/lib/*.tbd 2>/dev/null || true
          done

      - name: Check out dvb-libusb
        uses: actions/checkout@v4
        with:
          repository: rado0x54/dvb-libusb
          ref: ${{ env.DVB_LIBUSB_REF }}
          path: dvb-libusb

      - name: Fetch lifted chip-driver sources
        run: |
          cd dvb-libusb
          bash scripts/fetch-lifted.sh

      - name: Configure minisatip (Linux)
        if: runner.os == 'Linux'
        run: |
          # -DSTATIC=ON makes -static handle .a preference at link
          # time for every -l<lib> (libdvbcsa from our scratch prefix
          # via -L; libcrypto/libsrt/libusb from apt's -dev packages).
          # NETCVCLIENT stays off (libnetceiver not packaged in apt).
          cmake -B build \
            -DUSERSPACE_DVB=ON \
            -DDVB_LIBUSB_SOURCE_DIR="$PWD/dvb-libusb" \
            -DDVBCSA=ON \
            -DCMAKE_C_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$GITHUB_WORKSPACE/libdvbcsa-install/lib" \
            -DSTATIC=ON -DLINUXDVB=ON -DNETCVCLIENT=OFF

      - name: Configure minisatip (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS has no -static linker flag — handled instead by the
          # rm-dylib step above that leaves only .a archives in each
          # brew prefix we depend on. Bare -l<lib> link references
          # then resolve naturally to .a. -L flags point at our
          # scratch libdvbcsa prefix and at brew's keg-only openssl@3
          # (libsrt.a has transitive openssl symbol references).
          # NETCVCLIENT/LINUXDVB/DVBCA are off on Apple (force-
          # disabled by CMakeLists).
          cmake -B build \
            -DUSERSPACE_DVB=ON \
            -DDVB_LIBUSB_SOURCE_DIR="$PWD/dvb-libusb" \
            -DLINUXDVB=OFF -DNETCVCLIENT=OFF \
            -DDVBCSA=ON -DSRT=ON \
            -DSRT_INCLUDE_DIR="$(brew --prefix srt)/include" \
            -DCMAKE_C_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$GITHUB_WORKSPACE/libdvbcsa-install/lib -L$(brew --prefix openssl@3)/lib"

      - name: Build minisatip
        run: |
          cmake --build build -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"

      - name: Verify binary
        run: |
          file build/minisatip
          ./build/minisatip --version || true

      - name: Package
        run: |
          mkdir -p dist
          ZIP_NAME="minisatip-userspace-dvb-${{ matrix.arch }}.zip"
          # Bundle the binary plus the html/ web-UI directory.
          zip -9 -r "dist/$ZIP_NAME" build/minisatip html

      - uses: actions/upload-artifact@v4
        with:
          name: minisatip-userspace-dvb-${{ matrix.arch }}
          path: dist/*.zip

  release:
    needs: build
    # Only publish a release when a tag is pushed on this fork.
    # Upstream's existing release job keeps doing its own thing.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'rado0x54'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*.zip
          file_glob: true
          tag: ${{ github.ref_name }}
          overwrite: true
