name: Userspace DVB Binaries

# Cross-platform static binaries with USERSPACE_DVB=ON. Targets Apple
# Silicon plus the x86_64 and aarch64 Synology model families. Each
# job builds libusb-1.0 statically from source so the resulting binary
# has no third-party shared-lib runtime dependencies — libudev is
# disabled on Linux (libusb still enumerates without it; hotplug just
# becomes unavailable, which we don't use), and on macOS libusb talks
# to IOKit directly so udev is moot.

on:
  push:
    branches: [ master, userspace-dvb-support ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DVB_LIBUSB_REF: v0.1.2
  LIBUSB_VERSION: "1.0.27"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
          - runner: macos-14
            arch: arm64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # libdvbcsa + libusb are built from source below:
          #   - libdvbcsa needs the ICAM extension from catalinii's fork
          #   - libusb has to be built --disable-udev because Ubuntu's
          #     libusb-1.0-0-dev links libusb against libudev which
          #     isn't shipped as a .a (only .so), breaking -static.
          # libssl-dev, libsrt-openssl-dev ship .a archives that
          # -static picks up cleanly.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config zip ca-certificates \
            wget tar bzip2 autoconf libtool automake \
            libssl-dev libsrt-openssl-dev

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          # libdvbcsa is built from source below (we need the ICAM
          # extension, not in the brew formula). libusb + srt + openssl
          # come from brew; dvb-libusb's DVB_LIBUSB_PREFER_LIBUSB_STATIC
          # option below forces libusb to resolve to its .a even though
          # the .dylib sits beside it.
          brew install --quiet cmake pkg-config autoconf libtool automake wget \
            libusb srt openssl@3

      - name: Build libusb-1.0 static (Linux, --disable-udev)
        if: runner.os == 'Linux'
        run: |
          set -eux
          # Ubuntu's apt libusb-1.0-0-dev compiles libusb with udev
          # support, which means libusb-1.0.a has unresolved -ludev
          # references — and Ubuntu doesn't ship libudev.a. Building
          # libusb ourselves with --disable-udev sidesteps the whole
          # chain. We don't use libusb hotplug, so the loss is moot.
          wget -q "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2"
          tar xf "libusb-${LIBUSB_VERSION}.tar.bz2"
          cd "libusb-${LIBUSB_VERSION}"
          ./configure \
            --disable-shared --enable-static --disable-udev \
            --prefix="$GITHUB_WORKSPACE/libusb-install"
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"
          make install

      - name: Build libdvbcsa (with ICAM) from source
        run: |
          set -eux
          # catalinii/libdvbcsa carries the ICAM extension that
          # minisatip's src/csa.cpp probes for via a weak symbol.
          # Building from source on all platforms gives both the ICAM
          # symbol and a guaranteed libdvbcsa.a — the apt package on
          # Linux may not always ship the static archive, and the brew
          # formula on macOS doesn't carry the ICAM extension either.
          git clone --depth 1 https://github.com/catalinii/libdvbcsa.git libdvbcsa-src
          cd libdvbcsa-src
          autoreconf -fi
          ./configure \
            --disable-shared --enable-static \
            --prefix="$GITHUB_WORKSPACE/libdvbcsa-install"
          make -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"
          make install

      - name: Force static-only brew prefixes (macOS)
        if: runner.os == 'macOS'
        run: |
          # Apple's ld has no -static flag, so we coerce static linking
          # by removing the .dylib/.tbd siblings from each brew prefix
          # we depend on. With only .a left in the prefix the linker
          # has nothing else to pick. Safe because runners are
          # ephemeral. openssl@3 is keg-only so its dylibs live under
          # opt/openssl@3 rather than /opt/homebrew/lib.
          for prefix in $(brew --prefix libusb) $(brew --prefix srt) $(brew --prefix openssl@3); do
            rm -fv "$prefix"/lib/*.dylib "$prefix"/lib/*.tbd 2>/dev/null || true
          done

      - name: Check out dvb-libusb
        uses: actions/checkout@v6
        with:
          repository: rado0x54/dvb-libusb
          ref: ${{ env.DVB_LIBUSB_REF }}
          path: dvb-libusb

      - name: Fetch lifted chip-driver sources
        run: |
          cd dvb-libusb
          bash scripts/fetch-lifted.sh

      - name: Configure minisatip (Linux)
        if: runner.os == 'Linux'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libusb-install/lib/pkgconfig
        run: |
          # SRT is off on Linux for now: Ubuntu's libsrt-openssl-dev
          # references AES_wrap_key/AES_unwrap_key, which OpenSSL 3.x's
          # libcrypto.a no longer exports (moved to the legacy provider
          # that isn't pulled in statically). Re-enable once we either
          # build openssl+libsrt from source (catalinii style) or
          # Ubuntu's libsrt-openssl-dev gets rebuilt to not need those.
          # macOS keeps SRT enabled — brew's openssl@3 + libsrt are
          # built against each other compatibly.
          cmake -B build \
            -DUSERSPACE_DVB=ON \
            -DDVB_LIBUSB_SOURCE_DIR="$PWD/dvb-libusb" \
            -DDVBCSA=ON \
            -DHDHOMERUN=ON \
            -DCMAKE_C_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$GITHUB_WORKSPACE/libdvbcsa-install/lib" \
            -DSTATIC=ON -DLINUXDVB=ON -DNETCVCLIENT=OFF -DSRT=OFF

      - name: Configure minisatip (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS has no -static linker flag — handled instead by the
          # rm-dylib step above that leaves only .a archives in each
          # brew prefix. Bare -l<lib> then resolves naturally to .a,
          # but the linker has to know to search /opt/homebrew/lib
          # in the first place (not on its default search path on
          # Apple Silicon), hence the extra -L below. -L for our
          # libdvbcsa scratch prefix and openssl@3 (keg-only — its
          # lib dir isn't symlinked into /opt/homebrew/lib; libsrt.a
          # has transitive openssl symbol references). DVBCA/LINUXDVB/
          # NETCVCLIENT are off on Apple (force-disabled by CMakeLists).
          cmake -B build \
            -DUSERSPACE_DVB=ON \
            -DDVB_LIBUSB_SOURCE_DIR="$PWD/dvb-libusb" \
            -DLINUXDVB=OFF -DNETCVCLIENT=OFF \
            -DDVBCSA=ON -DSRT=ON \
            -DHDHOMERUN=ON \
            -DSRT_INCLUDE_DIR="$(brew --prefix srt)/include" \
            -DCMAKE_C_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/libdvbcsa-install/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$GITHUB_WORKSPACE/libdvbcsa-install/lib -L$(brew --prefix)/lib -L$(brew --prefix openssl@3)/lib -lssl -lcrypto"

      - name: Build minisatip
        run: |
          cmake --build build -j"$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"

      - name: Verify binary
        run: |
          file build/minisatip
          ./build/minisatip --version || true

      - name: Package
        run: |
          mkdir -p dist firmware
          cat > firmware/README.txt <<'EOF'
          Userspace DVB firmware directory
          ================================

          Drop DVB chip-driver firmware blobs into this directory, then
          run minisatip with FIRMWARE_DIR pointed at it:

              FIRMWARE_DIR="$PWD/firmware" ./minisatip ...

          Commonly required firmware files (per supported chip family):

            dvb-usb-dib0700-1.20.fw       — dib0700 bridge (most older
                                            Hauppauge / Pinnacle USB DVB
                                            sticks built around DiB0700)
            dvb-demod-si2168-b40-01.fw    — Si2168 demod (Hauppauge
                                            WinTV-dualHD DVB variant)
            dvb-demod-mn88472-02.fw       — MN88472 demod (Microsoft Xbox
                                            One Digital TV Tuner)

          Where to obtain them:

            * linux-firmware (canonical source):
              https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/
              Each blob lives at a path like
              https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/<filename>

            * Debian / Ubuntu: `apt install firmware-linux-nonfree`
              (files end up under /lib/firmware)

            * Any Linux box that has DVB stuff installed already:
              /lib/firmware/ usually carries them

          Alternative locations minisatip probes automatically (in order)
          if FIRMWARE_DIR is unset:

            /usr/local/share/minisatip/firmware
            /usr/local/lib/firmware
            /usr/lib/firmware
            /lib/firmware

          So if you copy the blobs into one of those system paths, you
          can omit FIRMWARE_DIR entirely.
          EOF
          ZIP_NAME="minisatip-userspace-dvb-${{ matrix.arch }}.zip"
          # Bundle the binary, the html/ web-UI directory, and an
          # empty (README-only) firmware/ dir so end users have a
          # clear drop-in spot for chip-driver firmware blobs.
          zip -9 -r "dist/$ZIP_NAME" build/minisatip html firmware

      - uses: actions/upload-artifact@v7
        with:
          name: minisatip-userspace-dvb-${{ matrix.arch }}
          path: dist/*.zip

  release:
    needs: build
    # Only publish a release when a tag is pushed on this fork.
    # Upstream's existing release job keeps doing its own thing.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'rado0x54'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*.zip
          file_glob: true
          tag: ${{ github.ref_name }}
          overwrite: true
